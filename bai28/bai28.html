<!-- 1. layout
 1.1 aspect radio : tỉ lệ 
 class                   thuộc tính
 aspect-auto             aspect-ratio:auto  // mặc định 
 aspect-sqaure           aspect-ratio: 1/1 // tỉ lệ hình vuông
 aspect-video            aspect-ratio:16/9; // tỉ lệ chuẩn video
 aspect-[width/height]   aspect-ratio: width/height;

 -->

 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
 </head>
 <body>
    <div class="text-[30px] border-[8px] border-[#F47F20] aspect-[4/3] ">
      Box 4
    </div>

<!-- 1.2 container 
 class           điểm ngắt       thuộc tính
 container       None            width:100%;  
          
 -->
 <div class="container bg-orange-500 mx-auto my-10">container</div>


<!-- display 
 class             thuộc tính 
 block             display: block //chiếm toàn bộ chiều rộng có sẵn trong khung chứa
                                    luôn bắt đầu từ 1 dòng mới 
                                    tự động xuống dòng 
                                    cho phép tùy chỉnh đầy đủ chiều rộng chiều cao
 inline-block      display: inline-block // cho phép phần tử hiện thị trên cùng 1 dòng vs phần tử khác
                                             cho phép thiết lập chiều rộng chiều cao
 inline            display: inline
 flex              display: flex 
 inline-flex       display: inline-flex 
 hidden            display: none 
 -->

 <!-- 1.4 object fit
  
 class                   thuộc tính
 object-contain          object-fit:contain  // hình ảnh video sẽ được tự động thu phóng
                                                sao cho vừa vặn hoàn toàn bên trong khung chứa
                                                mà vẫn giữ nguyên tỉ lệ gốc 
 object-cover            object-fit:cover
 object-none             object-fit:none-->


 <!--1.5 Overflow
 class                 thuộc tính 
 overflow-visible      overflow:visible // mặc định
 overflow-hidden       overflow:hidden // ẳn các nội dung bị tràn ra ngoài
 overflow-scroll       overflow:scroll // hiển thị thanh scroll
 overflow-auto         overflow-auto: khi nào nội dung vượt quá mới hiển thị thanh scroll -->


 <!--1.6  position 
 class                thuộc tính
 fixed                 position:fixed;  // đứng yên 1 chỗ khi cuộn trang web
 absolute              position:absoluted // định vị theo phần tử cha gần nhất
 relative              position:relative 
 sticky                position:sticky
  -->

<!-- 1.7 top/right/bottom /left
 class              thuộc tính
 top-[value]        top:value
 right-[value]
 bottom-[value]
 left-[value]
-->

<div class="w-[400px] aspect-square border-[5px] border-black relative">
  <div class="w-[100px] aspect-square border-[5px] border-[#D00] absolute top-[20px] right-[20px]"></div>
</div>


<!--1.8 Z-index // để khi các phần tử trùng vị trí thì ưu tiền phần tử nào
z-[value]
-->

<!-- flex box-->

<!-- 2.1 flex direction 
 class                   thuộc tính 
 flex-row                flex-direction: row // mặc định
 flex-row-reverse        flex-diẻction:row-reverse
 flex-col                flex-direction:column
 flex-col-reverse         flex-direction:column-reverse-->
 <div class="w-[600px] aspect-square bg-orange-300 flex gap-x-[20px] gap-y-[10px] flex-row flex-wrap justify-between items-stretch">
   <div class="w-[100px] h-[60px] bg-orange-800 text-white order-[1]">1</div>
   <div class="w-[100px] h-[60px] bg-orange-800 text-white order-[3]">2</div>
   <div class="w-[100px] h-[60px] bg-orange-800 text-white order-[0]">3</div>
   
   <div class="w-[100px] h-[60px] bg-orange-800 text-white order-[5]">4</div>
   <div class="w-[100px] h-[60px] bg-orange-800 text-white order-[4]">5</div>
 </div>
<!-- 2.2 flex wrap
 class                   thuộc tính
 flex-wrap               flex-wrap: wrap // cho phép các phần tử ngắt dòng và chuyển xuống dòng mới nếu không đủ chỗ trên 1 dòng
 flex-nowrap             flex-wrap:nowrap;  // mặc định nằm trên 1 dòng duy nhất , có thể bị co lại nếu vượt quá kích thước--> 

 <!-- 2.3 order -----------------------------
  oder-[value]    // sắp xếp lại thứ tự hiển thị của các phần tử con-->   


<!--2.4  justify content
class                         thuộc tính
justify-start                 justify-content:flex-start // căn các phần tử về phía đầu của trục chính
justify-end                   justify-content:flex-end // căn các phần tử về phía điểm kết thúc của trục chính
justify-center                justify-content:center // căn các phần tử vào chính giữa của trục chính
justify-between               justify-content:space-between  // khoảng cách giữa các phần tử bằng nhau hai phần tử cuối và đầu sát mép 
justify-around                justify-content:space-around // khoảng cách giữa hai phần tử liền kề lớn gấp đôi khoảng cách từ phần tử đến mép ngoài 
justify-evenly                justify-content:space-evenly // khoảng cách giữa các phần tử bằng nhau --> 

<!--2.5  align -items
class                              thuộc tính
items-start                        align-items:flex-start     // căn các phần tử về phía điểm bắt đầu với trục vuông góc 
items-end                          align-items:flex-end     // căn các phần tử về phía điểm kết thúc của trục vuông góc
items-center                       align-items:center    // căn các phần tử vào chính giữa theo trục vuông goca
items-stretch                      align-items:stretch   // kéo giãn các phần tử cho kín chiều cao chiều rộng của khung chứa tùy theo trục-->   


 </body>
 </html>

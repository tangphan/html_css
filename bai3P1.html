<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Bài 3 : thẻ ul ol li ..............................................
            +, thẻ ul : unordered list - không sắp xếp : các mục con được đánh dấu chấm tròn ở ô trước
            +,danh sách hiển thị kiểu không được đánh số   
            +, thẻ ol : ordered list : sắp xếp : các mục con sắp xếp theo thứ tự bằng số hoặc chữ cái    -->
    <ul>
        <li>Mục 1 </li>
        <ul>
            <li>Mục 1.1</li>
            <li>Mục 1.2</li>
            <ul>
                <li>Mục 1.2.1</li>
                <li>MỤc 1.2.2</li>
            </ul>
            <li>Mục 1.3</li>
        </ul>
        <li>Mục 2</li>
        <li>Mục 3</li>
    </ul>
    <ol>
        <li>Mục 1 </li>
        <ol>
            <li>Mục 1.1</li>
            <li>Mục 1.2</li>
            <ol>
                <li>Mục 1.2.1</li>
                <li>MỤc 1.2.2</li>
            </ol>
            <li>Mục 1.3</li>
        </ol>
        <li>Mục 2</li>
        <li>Mục 3</li>
    </ol>
    <!-- thuộc tính type chỉ áp dụng cho thẻ ol
      +,type="1" mặc định được đánh dạng số 1 2 3 
      +,type="A" các mục được đánh dạng chữ hoa A B C
      +,type="a" các mục  đánh chứ thường a bb c 
      +,type ="I" đánh số la mã viết hoa 
      type="i" đánh số la mã viết thường    
                                         -->
    <!-- thẻ iframe ....................................
     +, thẻ iframe dùng để nhúng một trang web khác vào trong trang web hiện tại
     cú pháp <ỉame src="url" width="" height=""></iframe>   -->
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14899.363302899344!2d105.81728845!3d20.99901675!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ac8109765ba5%3A0xd84740ece05680ee!2zVHLGsOG7nW5nIMSQ4bqhaSBo4buNYyBUaOG7p3kgbOG7o2k!5e0!3m2!1svi!2s!4v1790098620521!5m2!1svi!2s"
        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/lQO9ffZS0Pw?si=13i7wbG1BVDpYiBv"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <iframe src="https://www.28tech.com.vn/" width="1100" height="600"></iframe>

</body>

</html>

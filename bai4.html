<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bai4.css">
</head>

<body>
    <style>
        h1 {
            /* h1 là bộ chọn */
            color: blue
                /* thuộc tính */
        }
    </style>
    <h1>Nội dung của thẻ h1...</h1>
    <!-- có 3 cách chèn css 
     +, inline CSS (nội tuyến ) : thêm thuôc tính style vào trong thẻ mở html-->
    <h2 style="color:brown">Nội dung thẻ h2</h2>
    <h3 style="color:green">NỘi dung thẻ h3</h3>
    <!--+, internal css (nội bộ ): 
    thêm thẻ style vào bất cứ đâu trong file html 
    viết css vào trong thẻ style đó -->
    <style>
        p{
            color:blueviolet
        }
    </style>
    <p>Lorem ipsum dolor sit amet.</p>
    <p>Lorem ipsum dolor sit amet.</p>
    <!-- external css bên ngoài :
     tạo 1 file css ở bên ngoài 
     chèn file css vào html -->
     <h3>Lorem ipsum dolor sit amet.</h3>
     <h3>Lorem ipsum dolor sit amet consectetur<br>
         adipisicing elit. Repellendus aut fugiat eius quos,
          voluptatem debitis aliquam velit?</h3>

</body>

</html>

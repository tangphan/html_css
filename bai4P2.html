<!-- các thuộc tính liên quan đến màu sắc
 +, có 2 cách lấy màu sắc phổ biến :
 - màu đặt tên sẵn : white , black , red .....
 - màu dạng mã hex (phổ biến nhất )
 -màu dãng mã hex :
 +, cú pháp : #RRGGBB
  trong đó RR:red
  GG:Green
  BB:Blue -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <style>
        h1{
            color:#193F76;
            /*back-ground:color */
            background-color: red;
        }
        h2{
            color:#1734B5
        }
        h3{
            color:#135B56
        }
    </style>
    <h1>Nội dung thẻ h1 </h1>
    <h2>Nội dung thẻ h2</h2>
    <h3>Nội dung thẻ h3 </h3>
    <!-- background : nền 
     +, background (nền) dùng để thêm nền vào cho một phần tử 
     +, thuộc tính background-repeat :
     để thiết lập hình nền có lặp lại hay không
     +,background-position: để thiết lập vị trí của hình nền so với phần tử 
     
     +,background-color : thêm nền màu sắc -->
 </body>
 </html>

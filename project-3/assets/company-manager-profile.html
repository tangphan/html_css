<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Font Awesome CDN (Free v6.x) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="tailwind.config.js"></script>
</head>

<body>
    <!-- header ----------------------------------->
    <header class="bg-[#000071] py-[15px]">
        <div class="container mx-auto px-[16px]">
            <!-- wrap-->
            <div class=" flex items-center justify-between">
                <!-- logo-->
                <a href="#" class="text-white font-[800] sm:text-[28px] text-[20px] lg:flex-none flex-1">28.ITjobs</a>
                <!--menu-->
                <nav class="lg:block hidden">
                    <ul class="flex gap-x-[30px]">
                        <li class="inline-flex items-center gap-x-[8px] relative group/sub-1">
                            <a href="#" class="font-[600] text-[16px] text-white">Việc làm IT</a>
                            <i class="fa-solid fa-chevron-down text-white text-[16px]"></i>
                            <ul
                                class="absolute top-[100%] left-[0] w-[280px] bg-[#000065] hidden group-hover/sub-1:block">
                                <li
                                    class="py-[10px] px-[16px] rounded-[4px] flex items-center justify-between hover:bg-[#000096]">

                                    <a href="#" class="font-[600] text-[16px] text-white">
                                        Việc làm IT theo kĩ năngv
                                    </a>
                                    <i class="fa-solid fa-chevron-right text-white text-[16px]"></i>
                                </li>
                                <li
                                    class="py-[10px] px-[16px] rounded-[4px] flex items-center justify-between hover:bg-[#000096]">
                                    <a href="#" class="font-[600] text-[16px] text-white">
                                        Việc làm IT theo công ty
                                    </a>
                                    <i class="fa-solid fa-chevron-right text-white text-[16px]"></i>
                                </li>
                                <li
                                    class="py-[10px] px-[16px] rounded-[4px] flex items-center justify-between hover:bg-[#000096]">
                                    <a href="#" class="font-[600] text-[16px] text-white">
                                        Việc làm IT theo thành phố
                                    </a>
                                    <i class="fa-solid fa-chevron-right text-white text-[16px]"></i>
                                </li>
                            </ul>
                        </li>
                        <li class="inline-flex items-center gap-x-[8px]">
                            <a href="#" class="font-[600] text-[16px] text-white">Top Công Ty IT</a>
                            <i class="fa-solid fa-chevron-down text-white text-[16px]"></i>
                        </li>
                        <li class="inline-flex items-center gap-x-[8px]">
                            <a href="#" class="font-[600] text-[16px] text-white">Nhà tuyển dụng</a>
                            <i class="fa-solid fa-chevron-down text-white text-[16px]"></i>
                        </li>
                    </ul>
                </nav>
                <!--account-->
                <div class="inline-flex items-center-gap-x-[5px] text-white font-[600] sm:text-[16px] text-[12px]">
                    <a href="#" class="">Đăng nhập</a>
                    <span class="">/</span>
                    <a href="#" class="">Đăng ký</a>
                </div>
                <!--button menu mobiles-->
                <button class="text-white text-[20px] ml-[12px] lg:hidden inline-block">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <!-- end account-->
            </div>
        </div>
    </header>
    <!-- end header------------------------------------>
     <!--thông tin công ty-->
   <div class="">
     <div class="container mx-auto px-[16px]">
        <div class="border border-[#DEDEDE] rounded-[8px] p-[20px]">
            <h1 class="font-[700] text-[20px] text-black mb-[20px]">
                Thông tin Công Ty
            </h1>
            <form action="" class="grid grid-cols-2 gap-x-[20px] gap-y-[15px]">
                <div class="col-span-2">
                    <label form="companyName" class="block font-[500] text-[14px] text-black mb-[5px]">
                        Tên công ty
                    </label>
                    <input type="text" name="" id="companyName" class="w-[100%] h-[46px] border border-[#DEDEDE] rounded-[4px] px-[20px] font-[500] text-[14px] text-black">
                </div>
                
                
                <div class="mb-[15px]">
                    <label for="logo" class="block font-[500] text-[14px] text-black mb-[5px]">
                      Logo
                    </label>
                <input type="file" name="" id="logo" accept="image/*" class="w-[100%] h-[46px] border border-[#DEDEDE] rounded-[4px] px-[20px] font-[500] text-[14px] text-black">
                <div class="">
                    <label for="city" class="block font-[500] text-[14px] text-black mb-[5px]">
                           Thành phố
                    </label>
                    <select name="" id="city" class="w-[100%] h-[46px] border border-[#DEDEDE] rounded-[4px] py-[14px] px-[20px] font-[500] text-[14px] text-black">
                        <option value="">Hà Nội</option>
                        <option value="">Đà Nẵng</option>
                        <option value="">Hồ Chí Minh</option>
                    </select>
                </div>
                <div class="">
                    <label for="address" class="block font-[500] text-[14px] text-black mb-[5px]">
                        Địa chỉ 
                    </label>
                    <input type="text" name="" id="address" class="w-[100%] h-[46px] border border-[#DEDEDE] rounded-[4px] py-[14px] px-[20px] font-[500] text-[14px] text-black">
                    
                </div>
                <div class="col-span-2">
                    <button class="px-[20px] h-[48px] rounded-[4px] bg-[#0088FF] font-[700] text-[16px] text-white">
                      Cập nhật
                    </button>
                </div>
                </div>
            </form>
        </div>
     </div>
   </div>
    
    <!--footer-->
    <footer class="bg-[#000065] py-[24px]">
        <div class="container mx-auto px-[16px]">
            <div class="text-white font-[800] text-[28px] text-center mb-[10px]">
                28.ITJobs
            </div>
            <div class="text-[#A6A6A6] font-[400] text-[14px] text-center">
                Copyright IT VIEC JSC
            </div>
        </div>
    </footer>
    <!--end footer-->
    <!-- Dựng Trang kết quả tìm kiếm-->
     
</body>

</html>
